<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f58a1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="꼬순내 분식">
  <title>꼬순내 분식</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="assets/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <button id="shopBtn" type="button" aria-label="가게 설정">
        <img class="px" id="shopIcon" alt="">
        <span id="shopName"></span>
      </button>
      <div id="lvBox" aria-label="레벨">
        <b id="lvNum"></b>
        <div class="xpbar"><i id="xpFill"></i></div>
      </div>
      <div id="coinBox" aria-label="코인">
        <img class="px" id="coinIcon" alt="">
        <b id="coinNum"></b>
      </div>
    </header>

    <p id="hint" role="status" hidden></p>

    <main id="stage">
      <canvas id="cv" aria-label="가게"></canvas>
    </main>

    <nav id="bar">
      <button type="button" data-nav="cook"><img class="px" alt=""><span>요리</span></button>
      <button type="button" data-nav="edit"><img class="px" alt=""><span>꾸미기</span></button>
      <button type="button" data-nav="pet"><img class="px" id="petIcon" alt=""><span id="petLabel"></span></button>
      <button type="button" data-nav="visit"><img class="px" alt=""><span>놀러가기</span></button>
      <button type="button" data-nav="daily"><img class="px" alt=""><span id="dailyLabel">주문</span></button>
    </nav>

    <div id="visitBar" hidden>
      <b id="visitText"></b>
      <button type="button" id="visitReport" class="btn">신고</button>
      <button type="button" id="visitLeave" class="btn primary"></button>
    </div>

    <section id="editPanel" hidden aria-label="꾸미기">
      <div class="edit-top">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="furn">가구</button>
          <button type="button" role="tab" data-tab="floor">바닥</button>
          <button type="button" role="tab" data-tab="wall">벽지</button>
          <button type="button" role="tab" data-tab="expand">확장</button>
        </div>
        <button type="button" id="editDone" class="btn primary">완료</button>
      </div>
      <div id="editInfo"></div>
      <div id="editGroups" class="chips" hidden></div>
      <div id="editList" class="hscroll"></div>
    </section>

    <div id="sheetWrap" hidden>
      <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle"></h2>
          <button type="button" id="sheetClose" class="btn">닫기</button>
        </div>
        <div id="sheetBody"></div>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <form id="intro" hidden>
      <img class="px" id="introPet" alt="">
      <h1>꼬순내 분식</h1>
      <p>떡볶이도 팔고 파스타도 파는<br>우리만의 작은 가게</p>
      <label>가게 이름<input id="introShop" maxlength="12" placeholder="주황 분식카페" autocomplete="off"></label>
      <p class="intro-label" id="introPetsLabel">함께할 친구</p>
      <div id="introPets" class="hscroll" role="radiogroup" aria-labelledby="introPetsLabel"></div>
      <label>친구 이름<input id="introPetName" maxlength="6" autocomplete="off"></label>
      <button type="submit" class="btn primary big">가게 열기</button>
    </form>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
